<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Nanita">
  <title>Nanita</title>
  <!--
    Base B · SQUIRCLE — a recomendação medida da prancha 19b do Paper.

    O achado é de uma linha: a base só ganha haste ficando mais reta. Disco,
    botton, adesivo e losango gastam área desenhando a própria borda, e quem
    paga é o N. A 16px, com o piso de 2px (abaixo disso a haste sai cinza de
    antialias, não Grafite):

      A · disco             2,1px de haste    78% do quadrado pintado
      B · squircle          2,5px             93%   ← esta arte
      C · quadrado sangrado 2,6px            100%   ← apple-touch-icon
      F · losango           1,4px             50%

    Squircle na ABA porque ninguém recorta o favicon: ele precisa do próprio
    canto para não encostar na aba vizinha.

    O N é o MESMO path do lockup — nada foi redesenhado para caber em 16px.
    Carimbo sobre Grafite lê a 5,22:1. Gerado por scratchpad/gen-favicon.mjs.
  -->
  <rect width="64" height="64" rx="18" fill="#F1678D"/>
  <g transform="translate(11.92 6.65) scale(0.31656)" fill="#2E2028">
    <path fill-rule="evenodd" d="M0 0L0 159.25C2.86 160.32 0.23 160.17 2.46 160.17L20.46 160.15L29.46 160.13C31.96 160.13 28.78 160.34 31.59 159.46L31.59 54.25C34 55.77 31.69 52.43 33.17 55.25L37.9 63.25L49.13 82.25C59.87 99.74 70.28 117.5 80.61 135.25L88.78 149.25C90.82 152.96 92.75 156.93 95.46 160.13L126.87 160.13L126.87 1.25C123.92 -0.08 127.88 0.29 124.46 0.16L114.46 0.17L99.46 0.21C96.41 0.23 93.32 0.03 90.39 0.56L90.39 89.25C87.22 85.23 91.9 92.55 88.82 87.25L83.92 79.25C80.61 74.46 77.55 69.31 74.64 64.25C71.12 58.11 66.76 52.41 63.26 46.25C58.97 38.71 53.96 31.39 49.05 24.25C43.56 16.28 39.22 7.26 32.79 0L0 0Z"/>
