name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: test + build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # versão vem do campo "packageManager" do package.json da raiz

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # --concurrency=1 de propósito: rodar store e backoffice em paralelo satura
      # o runner de 2 vCPUs (jsdom pesado) e a suíte do backoffice fica flaky.
      - name: test
        run: pnpm exec turbo run test --concurrency=1

      # O `.env` de cada app é gitignored, e o CI não tem nenhum. Duas coisas quebram sem estas
      # variáveis, e a segunda só apareceu quando o `index.html` passou a referenciá-las:
      #
      #   1. O client de `@estrelinha/supabase` LANÇA no carregamento do módulo sem elas — de
      #      propósito, para que falta de configuração não vire fallback silencioso. Isso já custou
      #      uma quebra de CI e foi resolvido em `vitest.config.ts`, que as fixa em `test.env`.
      #   2. **O `vite build` ABORTA** quando o `index.html` usa `%VITE_...%` e a variável não
      #      existe: `%VITE_SUPABASE_URL% is not defined in env variables`. O `preconnect` da
      #      feature 38 (`PRF-04`) usa exatamente essa forma, para não cravar o host num segundo
      #      lugar — e por isso o build passou a exigir a variável em tempo de compilação.
      #
      # É a mesma lição, um passo adiante: **o que lê `import.meta.env` mede a MÁQUINA, não o
      # código**. A Vercel tem as variáveis no ambiente dela e sempre passou; o CI não tinha, e
      # falhava com um erro que nem parece de build.
      #
      # Os valores são deliberadamente falsos e só precisam ser parseáveis: o artefato deste passo
      # é uma prova de fumaça e nunca é publicado — quem publica é a Vercel, com as variáveis dela.
      - name: build
        run: pnpm build
        env:
          VITE_SUPABASE_URL: https://ci-nao-publica.invalid
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-nao-e-segredo

      # Lint e typecheck têm baseline de erros pré-existentes (ver CLAUDE.md →
      # "Estado conhecido / dívidas"). Rodam para dar visibilidade, mas não
      # bloqueiam o merge enquanto a baseline não for zerada.
      - name: lint (não bloqueante — baseline conhecida)
        run: pnpm lint
        continue-on-error: true

      - name: typecheck (não bloqueante — baseline conhecida)
        run: |
          npx tsc --noEmit -p apps/store/tsconfig.app.json
          npx tsc --noEmit -p apps/backoffice/tsconfig.app.json
        continue-on-error: true
