name: Supabase Deploy

# Aplica no projeto Supabase hospedado o que foi mergeado na master:
#   1. migrations pendentes  (supabase db push)
#   2. edge functions        (supabase functions deploy)
#
# NÃO faz `supabase config push`. O supabase/config.toml é a configuração de
# DESENVOLVIMENTO LOCAL (site_url = 127.0.0.1:8080, redirect urls de localhost,
# SMTP com redirect de dev). Empurrá-lo derrubaria o auth de produção. Auth,
# SMTP e templates do projeto hospedado são configurados no painel — ver
# .specs/archive/nanita/DEPLOY.md (guia da loja anterior — o procedimento vale, os
# identificadores de projeto nao).

# SEM filtro de `paths` de propósito. Com ele, um push que não tocasse `supabase/**` não gerava
# execução nenhuma — e run ausente é **indistinguível** de run quebrado na aba Actions. Custou uma
# investigação no primeiro deploy: o que tinha falhado era um secret, mas a leitura foi "o workflow
# não roda". Rodando sempre, master == produção é uma afirmação verificável.
#
# O custo de rodar sempre é contido dentro do job, no passo `mudou`: o deploy das functions só
# acontece quando `supabase/functions/**` mudou de fato.
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      deploy_functions:
        description: "Fazer deploy das edge functions"
        type: boolean
        default: true
      push_migrations:
        description: "Aplicar migrations pendentes"
        type: boolean
        default: true

# Nunca cancelar um deploy de banco no meio.
concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      # `vars`, não `secrets`, e a distinção é de CLASSIFICAÇÃO, não de conveniência: o ref do
      # projeto **não é segredo**. Ele já está versionado neste repositório, em
      # `apps/store/vercel.json`, e o navegador de toda cliente o resolve em cada request.
      #
      # Guardá-lo como secret teria um custo concreto: o GitHub mascara secret em log, então o ref
      # sairia como `***` em toda mensagem de erro — justamente onde ele é a informação que
      # interessa para depurar.
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      # `fetch-depth: 0` porque o passo `mudou` compara com o commit anterior ao push. O default
      # (profundidade 1) traz um único commit, e o `git diff` contra a base falharia.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Redeployar as 5 functions a cada commit de documentação reinicia a `mercado-pago`, que
      # atende o webhook de pagamento. Então o deploy delas é condicionado ao que mudou.
      #
      # `db push` NÃO recebe o mesmo tratamento, e a assimetria é deliberada: sem migration
      # pendente ele já é no-op, e decidir por diff arriscaria pular uma migration que ficou para
      # trás num push anterior que falhou. Estado de banco se decide pelo estado, nunca pelo diff.
      #
      # Na dúvida, DEPLOYA: branch nova, force-push ou histórico sem base comum caem no ramo
      # permissivo. Um deploy a mais é barato; uma function velha em produção não é.
      - name: houve mudança em functions?
        id: mudou
        run: |
          if [ "${{ github.event_name }}" != 'push' ]; then
            # workflow_dispatch: quem decide é o input, não o diff.
            echo "functions=${{ inputs.deploy_functions }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          antes="${{ github.event.before }}"
          if [ -z "$antes" ] \
             || [ "$antes" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$antes^{commit}" 2>/dev/null; then
            echo "Sem base de comparação confiável — deploya por precaução."
            echo "functions=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$antes" "${{ github.sha }}" | grep -q '^supabase/functions/'; then
            echo "Houve mudança em supabase/functions/ — as functions vão subir."
            echo "functions=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nada mudou em supabase/functions/ — deploy das functions pulado."
            echo "functions=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Secret ausente chega ao step como string VAZIA — o GitHub não avisa, e a falha aparece
      # como erro da CLI: `required flag(s) "project-ref" not set`. A mensagem fala do comando e
      # manda procurar no lugar errado; o que faltou foi a configuração do repositório.
      #
      # Já custou um deploy (run de 2026-08-16, commit 9fb5dde): o environment tinha
      # SUPABASE_ACCESS_TOKEN e SUPABASE_DB_PASSWORD, e faltava SUPABASE_PROJECT_REF.
      #
      # `[ -n "$X" ]` não imprime valor nenhum — e o GitHub mascara secret no log de qualquer forma.
      - name: conferir a configuração do deploy
        run: |
          faltando=""
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || faltando="$faltando SUPABASE_ACCESS_TOKEN(secret)"
          [ -n "$SUPABASE_DB_PASSWORD" ]  || faltando="$faltando SUPABASE_DB_PASSWORD(secret)"
          [ -n "$PROJECT_REF" ]           || faltando="$faltando SUPABASE_PROJECT_REF(variable)"
          if [ -n "$faltando" ]; then
            echo "::error::configuração ausente no environment \`production\`:$faltando"
            echo "Settings → Environments → production — secrets em Secrets, variables em Variables."
            exit 1
          fi
          # O ref é o subdomínio NU, não a URL. `https://<ref>.supabase.co` é o que se copia da
          # barra de endereço, e é o engano natural — a CLI recusa com uma mensagem sobre formato
          # de flag, que não diz onde o valor foi digitado errado. 20 caracteres, minúsculos.
          if ! printf '%s' "$PROJECT_REF" | grep -qE '^[a-z0-9]{20}$'; then
            echo "::error::SUPABASE_PROJECT_REF não parece um ref de projeto: '$PROJECT_REF'"
            echo "Esperado o subdomínio nu (20 caracteres), sem 'https://' e sem '.supabase.co'."
            exit 1
          fi

      - name: link
        run: supabase link --project-ref "$PROJECT_REF"

      # `functions deploy` sobe o código mesmo sem secret nenhum, e a falha só
      # aparece na PRIMEIRA CHAMADA — no caso da `mercado-pago`, com a cliente na
      # frente do checkout. Conferir antes é o que transforma um apagão silencioso
      # em um deploy que recusa subir.
      #
      # `secrets list` imprime NOME + DIGEST, nunca o valor — não há o que vazar no log.
      # Roda ANTES do `db push` de propósito: falhando aqui, nada foi aplicado.
      #
      # RESEND_DEV_REDIRECT_TO fica de fora porque NÃO pode existir em produção —
      # preenchida, ela desvia todo transacional e nenhum cliente recebe e-mail.
      # STRICT_VARIANT_PRICING também fica de fora: é opcional e o default é `true`.
      - name: conferir secrets das edge functions
        if: ${{ steps.mudou.outputs.functions == 'true' }}
        run: |
          lista="$(supabase secrets list --project-ref "$PROJECT_REF")"
          faltando=""
          for nome in \
            MERCADO_PAGO_ACCESS_TOKEN \
            MERCADO_PAGO_WEBHOOK_SECRET \
            RESEND_API_KEY \
            RESEND_FROM \
            STORE_PUBLIC_URL
          do
            grep -qw "$nome" <<<"$lista" || faltando="$faltando $nome"
          done
          if [ -n "$faltando" ]; then
            echo "::error::secrets ausentes no projeto hospedado:$faltando"
            echo "Definir uma vez, à mão (os valores nunca entram no repositório):"
            echo "  supabase secrets set NOME=valor --project-ref <ref>"
            exit 1
          fi
          echo "Os 5 secrets obrigatórios estão presentes."

      - name: migrations pendentes (dry run)
        run: supabase migration list --linked

      - name: db push
        if: ${{ github.event_name == 'push' || inputs.push_migrations }}
        run: supabase db push --linked

      # `_shared` é ignorado pelo CLI (prefixo `_`). O verify_jwt de cada
      # function vem de [functions.*] do config.toml.
      - name: functions deploy
        if: ${{ steps.mudou.outputs.functions == 'true' }}
        run: supabase functions deploy --project-ref "$PROJECT_REF"
