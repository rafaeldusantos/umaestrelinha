name: Supabase Deploy

# Aplica no projeto Supabase hospedado o que foi mergeado na master:
#   1. migrations pendentes  (supabase db push)
#   2. edge functions        (supabase functions deploy)
#
# NÃO faz `supabase config push`. O supabase/config.toml é a configuração de
# DESENVOLVIMENTO LOCAL (site_url = 127.0.0.1:8080, redirect urls de localhost,
# SMTP com redirect de dev). Empurrá-lo derrubaria o auth de produção. Auth,
# SMTP e templates do projeto hospedado são configurados no painel — ver
# .specs/archive/nanita/DEPLOY.md (guia da loja anterior — o procedimento vale, os
# identificadores de projeto nao).

on:
  push:
    branches: [master]
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - ".github/workflows/supabase-deploy.yml"
  workflow_dispatch:
    inputs:
      deploy_functions:
        description: "Fazer deploy das edge functions"
        type: boolean
        default: true
      push_migrations:
        description: "Aplicar migrations pendentes"
        type: boolean
        default: true

# Nunca cancelar um deploy de banco no meio.
concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: link
        run: supabase link --project-ref "$PROJECT_REF"

      # `functions deploy` sobe o código mesmo sem secret nenhum, e a falha só
      # aparece na PRIMEIRA CHAMADA — no caso da `mercado-pago`, com a cliente na
      # frente do checkout. Conferir antes é o que transforma um apagão silencioso
      # em um deploy que recusa subir.
      #
      # `secrets list` imprime NOME + DIGEST, nunca o valor — não há o que vazar no log.
      # Roda ANTES do `db push` de propósito: falhando aqui, nada foi aplicado.
      #
      # RESEND_DEV_REDIRECT_TO fica de fora porque NÃO pode existir em produção —
      # preenchida, ela desvia todo transacional e nenhum cliente recebe e-mail.
      # STRICT_VARIANT_PRICING também fica de fora: é opcional e o default é `true`.
      - name: conferir secrets das edge functions
        if: ${{ github.event_name == 'push' || inputs.deploy_functions }}
        run: |
          lista="$(supabase secrets list --project-ref "$PROJECT_REF")"
          faltando=""
          for nome in \
            MERCADO_PAGO_ACCESS_TOKEN \
            MERCADO_PAGO_WEBHOOK_SECRET \
            RESEND_API_KEY \
            RESEND_FROM \
            STORE_PUBLIC_URL
          do
            grep -qw "$nome" <<<"$lista" || faltando="$faltando $nome"
          done
          if [ -n "$faltando" ]; then
            echo "::error::secrets ausentes no projeto hospedado:$faltando"
            echo "Definir uma vez, à mão (os valores nunca entram no repositório):"
            echo "  supabase secrets set NOME=valor --project-ref <ref>"
            exit 1
          fi
          echo "Os 5 secrets obrigatórios estão presentes."

      - name: migrations pendentes (dry run)
        run: supabase migration list --linked

      - name: db push
        if: ${{ github.event_name == 'push' || inputs.push_migrations }}
        run: supabase db push --linked

      # `_shared` é ignorado pelo CLI (prefixo `_`). O verify_jwt de cada
      # function vem de [functions.*] do config.toml.
      - name: functions deploy
        if: ${{ github.event_name == 'push' || inputs.deploy_functions }}
        run: supabase functions deploy --project-ref "$PROJECT_REF"
