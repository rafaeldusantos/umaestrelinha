    <!-- Libre Baskerville = display e títulos · Outfit = corpo. São as duas
         famílias do arquivo do Paper (`--font-display` e `--font-body`).

         Os pesos são os que o DS declara, e só eles. Libre Baskerville
         **existe em 400 e 700, mais o itálico de 400** — não há 500 nem 600
         para pedir, e pedir peso que a família não tem faz o navegador
         sintetizar (falso-negrito) em vez de baixar. Outfit é variável, então
         vai como faixa `300..700`: uma requisição, cinco pesos do DS. -->
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Outfit:wght@300..700&display=swap" rel="stylesheet" />

    <!-- O monograma N da identidade v2 (prancha 19b). Duas bases para o mesmo
         N, e a variável é quem faz o recorte: SQUIRCLE na aba, porque ninguém
         recorta o favicon e ele precisa do próprio canto para não encostar na
         aba vizinha; QUADRADO SANGRADO no atalho do iPhone, porque lá o iOS
         aplica a própria máscara e arte pré-arredondada deixa sobra de canto. -->
