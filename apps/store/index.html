    <!-- `PRF-04`: DNS, TCP e TLS do Supabase acontecem EM PARALELO com o
         download do bundle, em vez de depois dele.

         Toda a loja — catálogo, configurações, fotos do Storage — vem deste
         host, e a primeira requisição só sai depois que o bundle interpreta.
         Em 4G, abrir a conexão custa de 300 a 600 ms que hoje são pagos em
         série. `crossorigin` é obrigatório: as requisições saem em modo CORS, e
         sem o atributo o navegador aqueceria a conexão ERRADA e abriria outra.

         A origem NÃO está escrita aqui, e isso é o ponto: quem a declara é
         `VITE_SUPABASE_URL`, a mesma variável de `.env.example` que o client de
         `@estrelinha/supabase` lê. Cravar o host produziria um segundo dono
         que diverge em silêncio no dia em que o projeto mudar — e o sintoma
         seria uma conexão aquecida para um host que ninguém usa. O Vite
         substitui a variável marcada abaixo, em dev e no build.

         DUAS CONSEQUÊNCIAS que já custaram tempo, e ficam escritas aqui:

         1. **O `vite build` ABORTA se a variável não existir** — não é aviso,
            é `Build failed`. O CI não tem `.env` (ele é gitignored), então o
            `ci.yml` fixa valores falsos no passo de build pelo mesmo motivo
            que o `vitest.config.ts` já fixava nos testes. A Vercel sempre
            passou porque tem as variáveis dela.
         2. **Não escreva o padrão de substituição dentro deste comentário.**
            O Vite varre o arquivo inteiro, inclusive comentários, e um
            exemplo escrito aqui vira um aviso em todo build, para sempre. -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <title>Uma Estrelinha - Joias afetivas artesanais em resina</title>
    <meta name="description" content="Joias feitas à mão em resina com o material que você envia: cinzas, leite materno, dente de leite e mecha de cabelo. Feitas por Adri Muniz, em Porto Alegre.">
    <meta name="author" content="Uma Estrelinha" />

    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- `PRF-14`: as duas faces do PRIMEIRO texto, pedidas antes de o CSS
         existir.

         Libre Baskerville = display e títulos · Outfit = corpo. São as duas
         famílias do arquivo do Paper (`--font-display` e `--font-body`), e
         desde a feature 38 elas vivem em `public/fonts`, servidas por este
         mesmo domínio. Nenhum terceiro entra no caminho do primeiro texto.

         O `@font-face` mora no `App.css`, junto do resto do tema — mas o
         navegador só o lê depois de baixar e interpretar o CSS do bundle.
         Estas duas linhas encurtam isso: o download começa com o HTML, em
         paralelo. Só as duas faces do primeiro texto entram aqui; o itálico
         é raro e não paga uma requisição adiantada.

         `crossorigin` é obrigatório mesmo sendo do próprio domínio: fonte é
         sempre buscada em modo CORS, e sem o atributo o navegador guardaria a
         resposta num balde que o `@font-face` não alcança — e baixaria tudo
         de novo. O ganho viraria o dobro do custo, sem erro em lugar nenhum.

         Os pesos são os que o DS declara, e só eles: Libre Baskerville
         **em 400 e 700, mais o itálico de 400** — não há 500 nem 600 para
         pedir, e pedir peso que a família não tem faz o navegador sintetizar
         (falso-negrito) em vez de baixar. Outfit é variável: um arquivo,
         faixa `300 700`, os cinco pesos do DS. -->
    <link rel="preload" href="/fonts/outfit-v15-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/libre-baskerville-v24-latin.woff2" as="font" type="font/woff2" crossorigin />
    <meta property="og:title" content="Uma Estrelinha - Joias afetivas artesanais em resina">
    <meta name="twitter:title" content="Uma Estrelinha - Joias afetivas artesanais em resina">
    <meta property="og:description" content="Joias feitas à mão em resina com o material que você envia: cinzas, leite materno, dente de leite e mecha de cabelo. Feitas por Adri Muniz, em Porto Alegre.">
    <meta name="twitter:description" content="Joias feitas à mão em resina com o material que você envia: cinzas, leite materno, dente de leite e mecha de cabelo. Feitas por Adri Muniz, em Porto Alegre.">
    <!-- O símbolo da marca, em duas bases, e a variável é quem faz o recorte:
         CANTO PRÓPRIO de 6% na aba, porque o navegador não arredonda favicon;
         QUADRADO SANGRADO no atalho do iPhone, porque lá o iOS aplica a própria
         máscara e arte pré-arredondada deixa sobra de canto. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <!-- `primary-strong` — a mesma superfície do header, que é o que o topo do
         navegador encosta no celular. -->
    <meta name="theme-color" content="#283A4A">
    <!-- A imagem do card de compartilhamento — a que o Google, o WhatsApp, o
         Facebook e o X mostram quando alguém cola um link da loja. Feature 62:
         é a arte "Joias afetivas com leite materno" da dona (2026-10-06), no
         lugar do lockup (`og-image.png`, que continua em `public/`).

         JPEG 1200×630, e as duas coisas são decisão: WebP (o formato em que a
         arte chegou) não é aceito por todo mensageiro, e o card largo recorta
         para ~1,91:1 — a arte quadrada perderia o título "JOIAS AFETIVAS". Por
         isso ela entra INTEIRA (630×630) no centro, sobre o próprio fundo
         #F2F2F2 dela.

         Vale para toda rota servida por este arquivo; a página de produto é
         servida pela função `api/page` (`core/page`, feature 69), que troca estas tags pela
         foto da joia.

         A URL é ABSOLUTA de propósito: o rastreador do Facebook não resolve
         caminho relativo. O domínio é o da loja — até o cutover ele ainda é a
         Nuvemshop, e a imagem só responde lá depois da virada. -->
    <meta property="og:image" content="https://umaestrelinha.com.br/joia-afetiva-leite-materno-uma-estrelinha.jpg">
    <meta property="og:image:type" content="image/jpeg">
