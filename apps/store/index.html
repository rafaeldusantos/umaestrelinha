<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Uma Estrelinha - Joias afetivas artesanais em resina</title>
    <meta name="description" content="Joias feitas à mão em resina com o material que você envia: cinzas, leite materno, dente de leite e mecha de cabelo. Feitas por Adri Muniz, em Porto Alegre.">
    <meta name="author" content="Uma Estrelinha" />

    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Libre Baskerville = display e títulos · Outfit = corpo. São as duas
         famílias do arquivo do Paper (`--font-display` e `--font-body`).

         Os pesos são os que o DS declara, e só eles. Libre Baskerville
         **existe em 400 e 700, mais o itálico de 400** — não há 500 nem 600
         para pedir, e pedir peso que a família não tem faz o navegador
         sintetizar (falso-negrito) em vez de baixar. Outfit é variável, então
         vai como faixa `300..700`: uma requisição, cinco pesos do DS. -->
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Outfit:wght@300..700&display=swap" rel="stylesheet" />
    <meta property="og:title" content="Uma Estrelinha - Joias afetivas artesanais em resina">
    <meta name="twitter:title" content="Uma Estrelinha - Joias afetivas artesanais em resina">
    <meta property="og:description" content="Joias feitas à mão em resina com o material que você envia: cinzas, leite materno, dente de leite e mecha de cabelo. Feitas por Adri Muniz, em Porto Alegre.">
    <meta name="twitter:description" content="Joias feitas à mão em resina com o material que você envia: cinzas, leite materno, dente de leite e mecha de cabelo. Feitas por Adri Muniz, em Porto Alegre.">
    <!-- O símbolo da marca, em duas bases, e a variável é quem faz o recorte:
         CANTO PRÓPRIO de 6% na aba, porque o navegador não arredonda favicon;
         QUADRADO SANGRADO no atalho do iPhone, porque lá o iOS aplica a própria
         máscara e arte pré-arredondada deixa sobra de canto. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <!-- `primary-strong` — a mesma superfície do header, que é o que o topo do
         navegador encosta no celular. -->
    <meta name="theme-color" content="#283A4A">
    <!-- Ativo do PRÓPRIO projeto, gerado do lockup por
         `.specs/brand/uma-estrelinha/_build-og.ps1`. Até a T35 esta linha
         apontava para um bucket do template original, servindo a arte de outro
         produto por um CDN que ninguém daqui controla.

         É a única superfície do produto onde o degrau 1 da escada de marca
         cabe: o piso do lockup é 600px de largura, e o card tem 1200.

         A URL é ABSOLUTA de propósito: o rastreador do Facebook não resolve
         caminho relativo, e um `og:image` que ele não resolve não vira card
         nenhum. O domínio é o mesmo das landing pages. -->
    <meta property="og:image" content="https://umaestrelinha.com.br/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:image" content="https://umaestrelinha.com.br/og-image.png">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
