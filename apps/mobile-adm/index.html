<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Ateliê · Uma Estrelinha</title>
    <!-- Ferramenta interna da dona: não é para ser indexada, nem compartilhada. -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- O ícone da aba (MAF-27): sem ele o Chrome pedia /favicon.ico (404) em toda abertura e mostrava
         o ícone genérico antes de instalar. É o mesmo PNG do manifest. -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <!-- As duas faces do primeiro texto, pedidas antes de o CSS existir — o mesmo par que a loja
         adianta. `crossorigin` é obrigatório mesmo no próprio domínio: fonte é buscada em modo CORS,
         e sem o atributo o navegador guardaria a resposta num balde que o `@font-face` não alcança. -->
    <link rel="preload" href="/fonts/outfit-v15-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/libre-baskerville-v24-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <!-- A splash estática entra aqui no build (`splashEstatica.ts`, MAF-28). -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
