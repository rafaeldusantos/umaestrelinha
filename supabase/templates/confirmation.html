<!--
  Uma Estrelinha — código de acesso (primeiro acesso / e-mail novo).

  O GoTrue usa ESTE template quando signInWithOtp({ shouldCreateUser: true })
  cria o usuário; para e-mail já existente usa magic_link.html. Configurar só um
  dos dois deixa metade dos casos no template padrão, que entrega LINK em vez do
  código de 6 dígitos — e a loja verifica código.

  Paleta e restrições de e-mail: ver o comentário de magic_link.html.
-->
<table width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#FAF8F4;padding:32px 12px;">
  <tr>
    <td align="center">
      <table width="560" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;width:100%;background:#FFFFFF;border:1px solid #E6DFD4;border-radius:20px;">
        <tr>
          <td align="center" style="background:#283A4A;padding:28px 32px;border-radius:20px 20px 0 0;">
            <span style="font-family:Georgia,'Times New Roman',serif;font-size:26px;letter-spacing:0.14em;line-height:1.2;color:#F7F3EC;">UMA ESTRELINHA</span>
            <div style="width:48px;height:1px;background:#B8945F;margin:12px auto 0;line-height:1px;font-size:1px;">&nbsp;</div>
          </td>
        </tr>
        <tr>
          <td style="padding:32px;font-family:Helvetica,Arial,sans-serif;">
            <h1 style="margin:0 0 8px;font-family:Georgia,'Times New Roman',serif;font-size:24px;font-weight:normal;line-height:1.3;color:#23303A;">Bem-vinda à Uma Estrelinha</h1>
            <p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#54616B;">Use o código abaixo para confirmar seu e-mail e criar sua conta. Ele expira em 10 minutos.</p>

            <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#F1EBE1;border:1px solid #E6DFD4;border-radius:12px;">
              <tr>
                <td align="center" style="padding:20px;">
                  <span style="font-family:Georgia,'Times New Roman',serif;font-size:34px;letter-spacing:0.18em;color:#34495E;">{{ .Token }}</span>
                </td>
              </tr>
            </table>

            <p style="margin:24px 0 0;font-size:13px;line-height:1.6;color:#54616B;">Não foi você que se cadastrou? Pode ignorar este e-mail — a conta não é criada sem o código.</p>
          </td>
        </tr>
        <tr>
          <td style="padding:0 32px 28px;font-family:Helvetica,Arial,sans-serif;font-size:12px;line-height:1.6;color:#54616B;">
            Uma Estrelinha — eternizando suas lembranças.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
