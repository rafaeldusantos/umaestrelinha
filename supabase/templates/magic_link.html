<!--
  Nanita — código de acesso (usuário já existente).
  Identidade Nanita (DESIGN.md): tinta #2B1622, glacê #FF86B5, geleia #B0176B,
  ameixa #7A5C6B, açúcar #FFEFF6, contorno #FFD7E7. Sem gradiente.
  Restrições de e-mail: tudo inline, layout em <table>, sem webfont (as famílias
  Berkshire Swash / Fredoka / DM Sans não carregam em Gmail/Outlook — o que
  renderiza é o fallback, por isso a pilha de fontes é a decisão de design).
-->
<table width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#FFEFF6;padding:32px 12px;">
  <tr>
    <td align="center">
      <table width="560" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;width:100%;background:#FFFFFF;border:1px solid #FFD7E7;border-radius:24px;">
        <tr>
          <td style="background:#2B1622;padding:24px 32px;border-radius:24px 24px 0 0;">
            <span style="font-family:'Berkshire Swash',Georgia,'Times New Roman',serif;font-size:32px;line-height:1.1;color:#FF86B5;">Nanita</span>
          </td>
        </tr>
        <tr>
          <td style="padding:32px;font-family:'DM Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
            <h1 style="margin:0 0 8px;font-family:'Fredoka','Trebuchet MS',Verdana,sans-serif;font-size:26px;font-weight:600;line-height:1.25;color:#2B1622;">Seu código de acesso</h1>
            <p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#7A5C6B;">Use o código abaixo para entrar na sua conta. Ele expira em 10 minutos.</p>

            <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#FFEFF6;border:1px solid #FFD7E7;border-radius:16px;">
              <tr>
                <td align="center" style="padding:20px;">
                  <span style="font-family:'Fredoka','Trebuchet MS',Verdana,sans-serif;font-size:36px;font-weight:600;letter-spacing:0.18em;color:#B0176B;">{{ .Token }}</span>
                </td>
              </tr>
            </table>

            <p style="margin:24px 0 0;font-size:13px;line-height:1.6;color:#7A5C6B;">Não pediu este código? Pode ignorar este e-mail — nada acontece sem ele.</p>
          </td>
        </tr>
        <tr>
          <td style="padding:0 32px 28px;font-family:'DM Sans',Helvetica,Arial,sans-serif;font-size:12px;line-height:1.6;color:#7A5C6B;">
            Nanita — cole no peito, carrega no coração.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
